name: Article Generator

# ─────────────────────────────────────────────────────────────────────────────
# Schedule (all times in Philippine Time, PHT = UTC+8)
#
#  Mon–Sun   8:00 PHT  → Morning article   (00:00 UTC)  comparison / tutorial / roundup
#  Mon–Sun  13:00 PHT  → Afternoon article (05:00 UTC)  roundup / tutorial / comparison
#  Mon–Sun  19:00 PHT  → Evening article   (11:00 UTC)  news digest / roundup / comparison
#
#  Friday   10:00 PHT  → Exclusive #1     (02:00 UTC)
#  Friday   12:00 PHT  → Exclusive #2     (04:00 UTC)
#  Friday   14:00 PHT  → Exclusive #3     (06:00 UTC)
#  Friday   16:00 PHT  → Exclusive #4     (08:00 UTC)
#  Friday   18:00 PHT  → Exclusive #5     (10:00 UTC)
#
#  Hourly catchup (30 * * * *): runs every hour at :30 — if GitHub delayed or
#  skipped a scheduled run, the script detects the missing slot and generates it.
#  The script exits early (no-op) when all expected articles are already done.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Mon–Sun Morning  (08:00 PHT = 00:00 UTC)
    - cron: '0 0 * * *'
    # Mon–Sun Afternoon (13:00 PHT = 05:00 UTC)
    - cron: '0 5 * * *'
    # Mon–Sun Evening  (19:00 PHT = 11:00 UTC)
    - cron: '0 11 * * *'
    # Friday Exclusive × 5 (every 2 hrs: 02–10 UTC = 10am–6pm PHT)
    - cron: '0 2 * * 5'
    - cron: '0 4 * * 5'
    - cron: '0 6 * * 5'
    - cron: '0 8 * * 5'
    - cron: '0 10 * * 5'
    # Hourly catchup — fires at :30 every hour, no-ops if nothing is missing
    - cron: '30 * * * *'

  # Also fires whenever the subscriber-sync workflow completes — that runs every
  # hour reliably and acts as a second heartbeat for article generation.
  workflow_run:
    workflows: ["Sync Subscriber List"]
    types: [completed]

  workflow_dispatch:
    inputs:
      slot:
        description: 'Force slot (morning | afternoon | evening | exclusive). Leave blank to auto-detect.'
        required: false
        default: ''

jobs:
  generate-article:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            pip install anthropic
          fi

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_SLOT: ${{ github.event.inputs.slot }}
        run: python .github/scripts/generate_article.py

      - name: Commit and push
        run: |
          git config user.email "bot@myaitoolsfinder.com"
          git config user.name "MyAI ToolsFinder Bot"
          git add articles/ articles.html .github/scripts/article_log.json
          if git diff --staged --quiet; then
            echo "Nothing to commit — article may already exist for this slot."
          else
            MSG="Auto-article: $(TZ='Asia/Manila' date +'%b %d %Y %I:%M %p PHT')"
            git commit -m "$MSG"
            # Pull rebase to handle rare concurrent Friday runs, then push
            git pull --rebase origin main || true
            git push
            echo "✅ Article published."
          fi
