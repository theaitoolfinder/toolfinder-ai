name: Article Generator

# ─────────────────────────────────────────────────────────────────────────────
# Schedule (all times in Philippine Time, PHT = UTC+8)
#
#  6 regular slots per day (every 4 hours):
#  Mon–Sun  08:00 PHT → slot: morning    (00:00 UTC)
#  Mon–Sun  12:00 PHT → slot: midday     (04:00 UTC)
#  Mon–Sun  16:00 PHT → slot: afternoon  (08:00 UTC)
#  Mon–Sun  20:00 PHT → slot: evening    (12:00 UTC)
#  Mon–Sun  00:00 PHT → slot: night      (16:00 UTC)
#  Mon–Sun  04:00 PHT → slot: latenight  (20:00 UTC)
#
#  10 Friday exclusives at odd hours (interleaved between regular slots):
#  09:00 PHT → Exclusive #1   (01:00 UTC)
#  11:00 PHT → Exclusive #2   (03:00 UTC)
#  13:00 PHT → Exclusive #3   (05:00 UTC)
#  15:00 PHT → Exclusive #4   (07:00 UTC)
#  17:00 PHT → Exclusive #5   (09:00 UTC)
#  19:00 PHT → Exclusive #6   (11:00 UTC)
#  21:00 PHT → Exclusive #7   (13:00 UTC)
#  23:00 PHT → Exclusive #8   (15:00 UTC)
#  01:00 PHT → Exclusive #9   (17:00 UTC)
#  03:00 PHT → Exclusive #10  (19:00 UTC)
#
#  Hourly catchup (30 * * * *): runs every hour at :30 — if GitHub delayed or
#  skipped a scheduled run, the script detects the missing slot and generates it.
#  The script exits early (no-op) when all expected articles are already done.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # ── 6 regular slots (every 4 hours) ──
    - cron: '0 0  * * *'   # morning    08:00 PHT
    - cron: '0 4  * * *'   # midday     12:00 PHT
    - cron: '0 8  * * *'   # afternoon  16:00 PHT
    - cron: '0 12 * * *'   # evening    20:00 PHT
    - cron: '0 16 * * *'   # night      00:00 PHT
    - cron: '0 20 * * *'   # latenight  04:00 PHT
    # ── Friday exclusives × 10 (odd hours, interleaved) ──
    - cron: '0 1  * * 5'
    - cron: '0 3  * * 5'
    - cron: '0 5  * * 5'
    - cron: '0 7  * * 5'
    - cron: '0 9  * * 5'
    - cron: '0 11 * * 5'
    - cron: '0 13 * * 5'
    - cron: '0 15 * * 5'
    - cron: '0 17 * * 5'
    - cron: '0 19 * * 5'
    # ── Hourly catchup ──
    - cron: '30 * * * *'

  # Also fires whenever the subscriber-sync workflow completes — that runs every
  # hour reliably and acts as a second heartbeat for article generation.
  workflow_run:
    workflows: ["Sync Subscriber List"]
    types: [completed]

  # Push trigger: any commit to main also runs the catchup check.
  # The script is idempotent — it exits early if all slots are already done.
  # Path-ignore prevents bot article-pushes from re-triggering themselves.
  push:
    branches: [main]
    paths-ignore:
      - 'articles/**'
      - 'articles.html'
      - '.github/scripts/article_log.json'
      - 'data/**'

  workflow_dispatch:
    inputs:
      slot:
        description: 'Force slot (morning | afternoon | evening | exclusive). Leave blank to auto-detect.'
        required: false
        default: ''

jobs:
  generate-article:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            pip install anthropic
          fi

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_SLOT: ${{ github.event.inputs.slot }}
        run: python .github/scripts/generate_article.py

      - name: Commit and push
        run: |
          git config user.email "bot@myaitoolsfinder.com"
          git config user.name "MyAI ToolsFinder Bot"
          git add articles/ articles.html .github/scripts/article_log.json sitemap.xml
          if git diff --staged --quiet; then
            echo "Nothing to commit — article may already exist for this slot."
          else
            MSG="Auto-article: $(TZ='Asia/Manila' date +'%b %d %Y %I:%M %p PHT')"
            git commit -m "$MSG"
            # Retry push up to 3 times — concurrent code pushes can reject the bot commit
            for attempt in 1 2 3; do
              echo "Push attempt $attempt..."
              git pull --rebase origin main && git push && echo "✅ Article published." && break
              if [ $attempt -lt 3 ]; then
                echo "Push failed — retrying in 10s..."
                sleep 10
              else
                echo "❌ Push failed after 3 attempts." && exit 1
              fi
            done
          fi
