name: Article Generator

# ─────────────────────────────────────────────────────────────────────────────
# Schedule (all times in Philippine Time, PHT = UTC+8)
#
#  THROTTLED (2026-07-09): was 6 regular slots/day + up to 16 on Fridays (311
#  articles in ~7 weeks). That publishing rate reads as scaled content abuse
#  to Google — impressions collapsed to near-zero after the initial indexing
#  window closed. Cut to ONE article per day to stop the bleeding and let the
#  title banks (comparison/roadmap/playbook pools) stop cycling back into
#  duplicate topics within a week.
#
#  Mon–Thu, Sat–Sun  08:00 PHT (00:00 UTC) → slot: morning
#  Friday            08:00 PHT (00:00 UTC) → slot: exclusive (subscriber-only)
#
#  Daily catchup (00:00 UTC + 12h = 12:00 UTC): safety net only, in case the
#  primary run failed — the script is idempotent and no-ops if today's single
#  article already exists.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 0  * * *'   # primary run — 08:00 PHT daily
    - cron: '0 12 * * *'   # catchup — 20:00 PHT, only fires the script if the primary run failed

  workflow_dispatch:
    inputs:
      slot:
        description: 'Force slot (morning | exclusive). Leave blank to auto-detect.'
        required: false
        default: ''

concurrency:
  group: article-generator
  cancel-in-progress: false

jobs:
  generate-article:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            pip install anthropic
          fi

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ARTICLE_SLOT: ${{ github.event.inputs.slot }}
        run: python .github/scripts/generate_article.py

      - name: Regenerate RSS feed
        run: python .github/scripts/generate_feed.py

      - name: Commit and push
        run: |
          git config user.email "bot@myaitoolsfinder.com"
          git config user.name "My AI Tools Finder Bot"
          git add articles/ articles.html .github/scripts/article_log.json sitemap.xml feed.xml data/api_usage.json
          if git diff --staged --quiet; then
            echo "Nothing to commit — today's article already exists."
          else
            MSG="Auto-article: $(TZ='Asia/Manila' date +'%b %d %Y %I:%M %p PHT')"
            git commit -m "$MSG"
            # Retry push up to 3 times — concurrent code pushes can reject the bot commit
            for attempt in 1 2 3; do
              echo "Push attempt $attempt..."
              git pull --rebase origin main && git push && echo "✅ Article published." && break
              if [ $attempt -lt 3 ]; then
                echo "Push failed — retrying in 10s..."
                sleep 10
              else
                echo "❌ Push failed after 3 attempts." && exit 1
              fi
            done
          fi
