name: Daily AI Article Generator

on:
  # Run every day at 8:00 AM UTC
  schedule:
    - cron: "0 8 * * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic to focus on (e.g. 'AI video tools', 'ChatGPT updates')"
        required: false
        default: ""

jobs:
  generate-article:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests
          # Install anthropic SDK only if API key is available
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            pip install anthropic
          fi

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CUSTOM_TOPIC: ${{ github.event.inputs.topic }}
        run: python .github/scripts/generate_article.py

      - name: Commit and push if article was created
        run: |
          git config user.email "bot@myaitoolsfinder.com"
          git config user.name "MyAI ToolsFinder Bot"
          git add articles/ articles.html
          if git diff --staged --quiet; then
            echo "No changes to commit — article may already exist for today."
          else
            git commit -m "Daily article: $(date +%Y-%m-%d)"
            git push
            echo "Article published successfully."
          fi
