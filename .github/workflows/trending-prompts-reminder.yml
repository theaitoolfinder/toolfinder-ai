name: Weekly Trending Prompts Auto-Update

on:
  schedule:
    # Every Friday at 9:00 AM UTC (5 PM Manila / 2 AM LA)
    - cron: '0 9 * * 5'
  workflow_dispatch:
    # Manual trigger from GitHub Actions tab

jobs:
  update-trending-prompts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Generate and update trending prompts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_viral_prompts.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/prompts-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            WEEK=$(date '+%B %-d, %Y')
            git commit -m "chore: auto-update trending viral prompts for week of $WEEK"
            git push
            echo "Pushed updated prompts."
          fi
